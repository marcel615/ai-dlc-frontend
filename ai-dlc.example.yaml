# Frontend AI-DLC 프로젝트별 설정 예시
# 이 파일을 ai-dlc.yaml로 복사한 뒤 프로젝트에 맞게 수정한다.
# 설정 키 이름은 유지하고, [변경 필요] 항목은 교체하며 [확인 필요] 항목은 실제 환경과 대조한다.
# 작업 절차와 승인 권한은 AGENTS.md를 따른다.
# 일반 개발 사이클에서는 이 예시와 실제 ai-dlc.yaml을 수정하지 않는다.
# 설정·운영 파일 변경은 사용자 승인을 받은 별도 AI-DLC 유지보수에서만 수행한다.

schema_version: 2

# [변경 필요] 실제 서비스 식별자
# 예: askteacher, myblog, shoppingmall
# 반드시 아래 services의 키와 일치해야 한다.
active_service: example

services:
  # [변경 필요] 위 active_service와 동일한 이름
  # 예: active_service: myblog → services.myblog
  example:

    # GitHub 저장소
    repositories:
      # 공식 요구사항·API·인증/인가·ERD·UI 명세를 읽기 전용으로 참조하는 Specs 저장소
      # 일반 개발에서는 원본을 수정하지 않으며 변경은 별도 계약 관리 절차를 따른다.
      common:
        enabled: true
        # [변경 필요] 예: marcel615/Ask-Teacher-specs
        repository: example-user/example-specs
        # [변경 필요] 해당 저장소의 기준 브랜치
        default_branch: main

      # 실제 개발할 Frontend 저장소
      frontend:
        enabled: true
        # [변경 필요] 예: marcel615/Ask-Teacher-react
        repository: example-user/example-frontend
        # [변경 필요] 실제 개발 기준 브랜치
        default_branch: develop

      # Frontend와 연동하는 Backend 저장소
      backend:
        # [확인 필요] Backend 저장소를 사용하는지 확인
        enabled: true
        # [변경 필요] 예: marcel615/Ask-Teacher
        repository: example-user/example-backend
        # [변경 필요] 해당 저장소의 기준 브랜치
        default_branch: develop

    # GitHub Projects
    project:
      # [변경 필요] Project를 소유한 사용자 또는 조직
      owner: example-user

      # [변경 필요] Project URL의 마지막 번호
      number: 1

      # [변경 필요] GitHub Projects의 GraphQL ID
      # 예: PVT_kwHOA3_2Ds4BqsK-
      id: REPLACE_WITH_PROJECT_ID

      # [변경 필요] 실제 Project 주소
      # 조직 Project라면 /orgs/조직명/projects/번호
      url: https://github.com/users/example-user/projects/1

      # [확인 필요] 실제 Project의 필드 이름
      # 왼쪽 키는 유지하고 오른쪽 필드 이름을 확인한다.
      fields:
        status: Status
        approval: Approval
        proposer: Proposer
        candidate_id: Candidate ID
        priority: Priority
        target_date: Target date

      # [확인 필요] Status 필드의 실제 선택지 이름
      statuses:
        backlog: Backlog
        ready: Ready
        in_progress: In Progress
        in_review: In Review
        done: Done

      # [확인 필요] 각 필드의 실제 선택지 이름
      approval_values:
        pending: Pending
        approved: Approved
      proposer_values:
        user: User
        ai: AI
      priority_values:
        high: High
        medium: Medium
        low: Low

    # GitHub Issue 라벨
    # [확인 필요] 실제 Frontend 저장소의 라벨과 일치시킨다.
    # 없으면 같은 이름으로 생성하거나, 기존 라벨 이름에 맞게 수정한다.
    # 왼쪽 설정 키(decision, high 등)는 변경하지 않는다.
    labels:
      decision: 'needs: decision'
      priority:
        high: 'priority: high'
        medium: 'priority: medium'
        low: 'priority: low'

    # 공식 요구사항: 아래 repository_role이 가리키는 Specs 저장소에서 읽기 전용 참조
    requirements:
      # [확인 필요] repositories에서 실제 Specs 저장소를 가리키는 역할
      # 역할 키는 연결용이며 수정 권한을 부여하지 않는다.
      repository_role: common

      # [확인 필요] 해당 저장소에서의 실제 문서 경로
      path: docs/requirements.md
      format: markdown

    # 공식 API·DB·UI 계약: Specs 저장소의 원본은 일반 개발·AI-DLC 유지보수에서 수정 금지
    # 변경 필요성은 기존 계약으로 구현할 대안을 먼저 검토하고 Main이 사용자에게 보고한다.
    # 관련 Issue·PR에 검토 근거·변경 사유·영향·수정안을 남기며 기존 Issue 수정 승인을 따른다.
    contracts:
      api:
        # [확인 필요] API 및 인증/인가 계약의 공식 문서와 그 문서의 공식 참조 확인
        # 아래 저장소 역할과 파일 경로는 실제 Specs 저장소를 가리켜야 한다.
        repository_role: common
        path: docs/api-spec.md
        format: markdown

      erd:
        # [확인 필요] ERD 저장소 역할과 파일 경로
        repository_role: common
        path: docs/erd.md
        format: markdown

      ui:
        # [확인 필요] UI 명세 저장소 역할과 파일 경로
        repository_role: common
        path: docs/ui-spec.md
        format: markdown

    # 브랜치·빌드·린트 설정
    development:
      # [확인 필요] 프로젝트의 작업 브랜치 규칙
      branch_pattern: 'feature/issue-번호-작업명'
      branch_prefix: 'feature/'

      # [확인 필요] 직접 구현하지 않을 보호 브랜치
      protected_branches:
        - main
        - develop

      # [확인 필요] 실제 Frontend 프로젝트의 검증 명령
      # package.json에 정의된 scripts를 기준으로 설정한다.
      build_command: 'npm run build'
      lint_command: 'npm run lint'

# 적용 전 체크:
# 1. [변경 필요] 항목은 반드시 실제 프로젝트 값으로 교체한다.
# 2. [확인 필요] 항목은 실제 환경과 비교하고, 일치하면 유지하고 다르면 수정한다.
# 3. active_service와 services의 키가 일치하는지 확인한다.
# 4. GitHub Project의 필드·선택지와 Issue 라벨이 실제로 존재하는지 확인한다.
#    없는 필드·라벨은 생성하거나 설정을 실제 값에 맞게 수정한다.
# 5. 공식 명세의 저장소·브랜치·파일 경로와 접근 권한을 확인한다.
# 6. Frontend·Backend 연결 정보와 개발 브랜치 규칙을 확인한다.
# 7. 빌드·린트 명령이 실제 프로젝트에서 실행되는지 확인한다.
# 8. 토큰·비밀번호·API 키 등 비밀값은 기록하지 않는다.
