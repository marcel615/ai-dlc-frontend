name: Feature Request
description: 기능 추가 / 수정 / 개선 요청
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        공식 명세는 `ai-dlc.yaml`의 활성 서비스 `requirements`, `contracts.api`, `contracts.authentication`(설정된 경우), `contracts.erd`, `contracts.ui`가 지정한 Specs 저장소의 읽기 전용 원본입니다. 관련 요약과 원본 링크를 남기고 미결정 사항을 구분하세요. 일반 개발에서는 공식 계약과 AI-DLC 운영 파일(README.md 제외)을 수정하지 않습니다. README.md는 승인된 작업 범위에서 수정할 수 있습니다.
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 필요한 기능인가?
      placeholder: |
        예) 사용자가 게시글 목록에서 제목을 클릭하면 상세 내용을 확인할 수 있어야 한다.
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 대상 화면 / 기능
      description: 어떤 화면 또는 기능을 수정하는가?
      placeholder: |
        예)
        - PostDetailPage
        - 게시글 상세 조회
        - /posts/:postId
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 원하는 동작
      description: 사용자가 어떤 흐름으로 기능을 사용하는가?
      placeholder: |
        예)
        - 게시글 목록에서 제목을 클릭한다.
        - /posts/{postId} 페이지로 이동한다.
        - 해당 게시글의 제목, 내용, 작성자, 생성일을 확인한다.
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: 관련 API
      description: 설정의 contracts.api와 contracts.authentication(설정된 경우)의 원본 링크 및 관련 요청·응답을 확인한다. 별도 인증 설정이 없을 때만 API의 공식 인증 참조를 따르며, 확인 실패·충돌·미결정 사항은 추측하지 않고 보고한다.
      placeholder: |
        예)
        - GET /api/posts/{postId}
        - 공식 API: ai-dlc.yaml의 contracts.api 참조
        - UI 동작: ai-dlc.yaml의 contracts.ui 참조
    validations:
      required: false

  - type: textarea
    id: contract-review
    attributes:
      label: 계약 변경 필요성 검토
      description: 기존 계약으로 구현 가능한 대안과 근거, 변경이 필요하면 사유·영향 범위·수정안·사용자 결정 및 별도 계약 관리 진행 상태를 기록한다. 원본은 직접 수정하지 않으며 기존 Issue 수정 승인을 따른다.
      placeholder: |
        - 변경 필요성: 없음 / 있음 / 확인 필요
        - 공식 원본 링크와 기존 계약 대안 검토 근거:
        - 변경 사유·영향 범위·수정안:
        - 보류 범위·사용자 결정·공식 반영 확인:
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 화면 구현
        - [ ] API 연결
        - [ ] 로딩 상태 처리
        - [ ] 에러 상태 처리
        - [ ] 입력값 검증
        - [ ] ai-dlc.yaml의 development.build_command / development.lint_command
        - [ ] 관련 자동·통합 검증과 화면 / Network / Console 확인
        - [ ] 실제 결과와 미검증 사항 기록
    validations:
      required: true

  - type: textarea
    id: excluded
    attributes:
      label: 제외 범위
      description: 이번 Issue에서 하지 않을 일을 적는다.
      placeholder: |
        예)
        - 로그인/토큰 인증 처리 제외
        - 댓글 기능 제외
        - 검색/페이징 제외
    validations:
      required: false
